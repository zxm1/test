name: Build AI Safety CN Dataset

on:
  push:
    paths:
      - ".github/workflows/build-ai-safety-cn-dataset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build normalized dataset package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out raw work
          python - <<'PY'
          import csv, io, json, os, re, sys, unicodedata, urllib.request, zipfile
          from pathlib import Path

          OUT = Path("out")
          RAW = Path("raw")
          WORK = Path("work")

          URLS = {
              "finsafety": "https://raw.githubusercontent.com/sustech-nlp/FinSafetyBench/main/data/FinsafetyBenchmark.csv",
              "safetybench": "https://huggingface.co/datasets/thu-coai/SafetyBench/resolve/main/test_zh.json?download=true",
              "financeqa": "https://huggingface.co/datasets/Multilingual-Multimodal-NLP/FinanceComplexQA/resolve/main/FinComplexQA-Pro.zip?download=true",
          }

          def download(url, path):
              print("download", url, "->", path)
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=180) as r, open(path, "wb") as f:
                  while True:
                      chunk = r.read(1024 * 1024)
                      if not chunk:
                          break
                      f.write(chunk)

          def clean_text(v):
              if v is None:
                  return ""
              if isinstance(v, (dict, list)):
                  return json.dumps(v, ensure_ascii=False, sort_keys=True)
              return str(v).strip()

          def structural_key(question, options=""):
              s = unicodedata.normalize("NFKC", clean_text(question)).lower()
              o = unicodedata.normalize("NFKC", clean_text(options)).lower()
              s = re.sub(r"[\s\W_]+", "", s, flags=re.UNICODE)
              o = re.sub(r"[\s\W_]+", "", o, flags=re.UNICODE)
              return s + ("||" + o if o else "")

          def load_json_flexible(path):
              text = Path(path).read_text(encoding="utf-8-sig")
              try:
                  obj = json.loads(text)
                  if isinstance(obj, list):
                      return obj
                  if isinstance(obj, dict):
                      # a dict may itself be one record, or a mapping of ids to records
                      if any(k in obj for k in ("question", "finqa_id", "id")):
                          return [obj]
                      vals = list(obj.values())
                      if vals and all(isinstance(x, dict) for x in vals):
                          return vals
                      return [obj]
              except json.JSONDecodeError:
                  pass
              rows = []
              for line in text.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  rows.append(json.loads(line))
              return rows

          # 1) FinSafetyBench
          fin_path = RAW / "FinsafetyBenchmark.csv"
          download(URLS["finsafety"], fin_path)
          fin_rows = []
          with fin_path.open("r", encoding="utf-8-sig", newline="") as f:
              for r in csv.DictReader(f):
                  fin_rows.append({
                      "dataset": "FinSafetyBench",
                      "source_id": clean_text(r.get("id")),
                      "language": "zh",
                      "benchmark_family": "金融安全/有害请求",
                      "category": clean_text(r.get("category_zh")),
                      "task_type": "开放式安全对齐",
                      "question": clean_text(r.get("question_zh")),
                      "options_json": "",
                      "gold_answer": "",
                      "reference_document": "",
                      "original_source": clean_text(r.get("source")),
                      "source_url": "https://github.com/sustech-nlp/FinSafetyBench",
                      "license": "see source repository",
                  })

          # 2) SafetyBench Chinese test
          sb_path = RAW / "SafetyBench_test_zh.json"
          download(URLS["safetybench"], sb_path)
          sb_data = load_json_flexible(sb_path)
          sb_rows = []
          for r in sb_data:
              opts = r.get("options", [])
              sb_rows.append({
                  "dataset": "SafetyBench",
                  "source_id": clean_text(r.get("id")),
                  "language": "zh",
                  "benchmark_family": "通用安全多选题",
                  "category": clean_text(r.get("category")),
                  "task_type": "多项选择安全评测",
                  "question": clean_text(r.get("question")),
                  "options_json": json.dumps(opts, ensure_ascii=False) if opts is not None else "",
                  "gold_answer": clean_text(r.get("answer")),  # test set normally has no label
                  "reference_document": "",
                  "original_source": "SafetyBench test_zh",
                  "source_url": "https://huggingface.co/datasets/thu-coai/SafetyBench",
                  "license": "MIT",
              })

          # 3) FinanceComplexQA Chinese unique QA: use scene_categories only (task view is duplicate representation)
          fq_zip = RAW / "FinComplexQA-Pro.zip"
          download(URLS["financeqa"], fq_zip)
          unzip_dir = WORK / "financeqa"
          unzip_dir.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(fq_zip) as z:
              z.extractall(unzip_dir)

          fq_records = {}
          candidate_files = []
          for p in unzip_dir.rglob("*"):
              ps = p.as_posix()
              if p.is_file() and p.suffix.lower() in (".json", ".jsonl") and "/CN/scene_categories/" in ps:
                  candidate_files.append(p)

          def iter_records(p):
              text = p.read_text(encoding="utf-8-sig")
              # JSON first
              try:
                  obj = json.loads(text)
                  if isinstance(obj, list):
                      yield from obj
                      return
                  if isinstance(obj, dict):
                      if any(k in obj for k in ("question", "finqa_id")):
                          yield obj
                          return
                      vals = list(obj.values())
                      if vals and all(isinstance(x, dict) for x in vals):
                          yield from vals
                          return
              except json.JSONDecodeError:
                  pass
              for line in text.splitlines():
                  line = line.strip()
                  if line:
                      yield json.loads(line)

          for p in sorted(candidate_files):
              parts = p.as_posix().split("/")
              try:
                  scene = parts[parts.index("scene_categories") + 1]
              except Exception:
                  scene = ""
              for r in iter_records(p):
                  if not isinstance(r, dict):
                      continue
                  fid = clean_text(r.get("finqa_id") or r.get("id"))
                  q = clean_text(r.get("question"))
                  if not q:
                      continue
                  key = fid or structural_key(q)
                  if key in fq_records:
                      continue
                  gold = r.get("gold", r.get("answer", ""))
                  fq_records[key] = {
                      "dataset": "FinanceComplexQA",
                      "source_id": fid,
                      "language": "zh",
                      "benchmark_family": "金融复杂问答/事实与推理",
                      "category": clean_text(r.get("doc_type") or scene),
                      "task_type": clean_text(r.get("task_type") or r.get("task_name") or r.get("topic_name")),
                      "question": q,
                      "options_json": "",
                      "gold_answer": clean_text(gold),
                      "reference_document": clean_text(r.get("Reference_documents") or r.get("reference_documents")),
                      "original_source": "FinComplexQA-Pro/CN/scene_categories",
                      "source_url": "https://huggingface.co/datasets/Multilingual-Multimodal-NLP/FinanceComplexQA",
                      "license": "Apache-2.0",
                  }
          fq_rows = list(fq_records.values())

          raw_rows = fin_rows + sb_rows + fq_rows

          # Exact/structural dedup only. Keep semantic near-duplicates.
          seen_exact = {}
          seen_struct = {}
          kept = []
          removed = []
          for row in raw_rows:
              exact_key = clean_text(row["question"]) + "||" + clean_text(row["options_json"])
              skey = structural_key(row["question"], row["options_json"])
              reason = ""
              dup_of = ""
              if exact_key in seen_exact:
                  reason = "exact_duplicate"
                  dup_of = seen_exact[exact_key]
              elif skey in seen_struct:
                  reason = "structural_duplicate"
                  dup_of = seen_struct[skey]
              if reason:
                  rr = dict(row)
                  rr["duplicate_reason"] = reason
                  rr["duplicate_of_global_id"] = dup_of
                  removed.append(rr)
                  continue
              gid = f"CN{len(kept)+1:05d}"
              row = dict(row)
              row["global_id"] = gid
              row["dedupe_key"] = skey
              kept.append(row)
              seen_exact[exact_key] = gid
              seen_struct[skey] = gid

          fields = [
              "global_id","dataset","source_id","language","benchmark_family","category","task_type",
              "question","options_json","gold_answer","reference_document","original_source",
              "source_url","license","dedupe_key"
          ]
          with (OUT / "AI安全评测中文主数据集.csv").open("w", encoding="utf-8-sig", newline="") as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              w.writerows(kept)

          rem_fields = [
              "dataset","source_id","question","options_json","duplicate_reason","duplicate_of_global_id",
              "source_url"
          ]
          with (OUT / "去重明细.csv").open("w", encoding="utf-8-sig", newline="") as f:
              w = csv.DictWriter(f, fieldnames=rem_fields, extrasaction="ignore")
              w.writeheader()
              w.writerows(removed)

          counts = {}
          for row in kept:
              counts[row["dataset"]] = counts.get(row["dataset"], 0) + 1

          summary = {
              "source_raw_counts": {
                  "FinSafetyBench": len(fin_rows),
                  "SafetyBench_zh": len(sb_rows),
                  "FinanceComplexQA_CN_unique": len(fq_rows),
                  "total": len(raw_rows),
              },
              "after_exact_structural_dedup": {
                  "total": len(kept),
                  "removed": len(removed),
                  "kept_by_dataset": counts,
              },
              "dedup_policy": "只去除完全重复及结构性重复（Unicode NFKC + 去空白/标点后相同）；保留语义近似样本。",
              "expected_reference_counts": {
                  "FinSafetyBench": 1881,
                  "SafetyBench_zh": 11435,
                  "FinanceComplexQA_CN_unique": 1013,
                  "raw_total": 14329
              }
          }
          (OUT / "数据集统计.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")

          with (OUT / "数据源说明.csv").open("w", encoding="utf-8-sig", newline="") as f:
              w = csv.writer(f)
              w.writerow(["数据集","用途","原始数量","来源","许可证","备注"])
              w.writerow(["FinSafetyBench","金融安全/有害请求红队样本",len(fin_rows),"https://github.com/sustech-nlp/FinSafetyBench","see source repository","中英对齐，本包取中文 question_zh"])
              w.writerow(["SafetyBench","通用安全多选题",len(sb_rows),"https://huggingface.co/datasets/thu-coai/SafetyBench","MIT","test_zh 标签不公开，answer 通常为空"])
              w.writerow(["FinanceComplexQA","金融复杂问答/事实与推理",len(fq_rows),"https://huggingface.co/datasets/Multilingual-Multimodal-NLP/FinanceComplexQA","Apache-2.0","只取 CN/scene_categories，避免 task_categories 重复视图"])

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload dataset package
        uses: actions/upload-artifact@v4
        with:
          name: ai-safety-cn-dataset
          path: out/*
          if-no-files-found: error
          retention-days: 7
